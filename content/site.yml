aboutIntro: "I'm Jainish — a computer science graduate student at **Vanderbilt University**, working where machine learning meets real, messy data. Most of what I do sits between three things: research questions I can't stop thinking about, software that has to actually run, and the craft of explaining both clearly."
aboutStory: |-
  I studied computer science at **Middle Tennessee State University**, where I served as vice president of the ACM chapter and spent a lot of weekends at hackathons. Along the way I fine-tuned transformer models for legislative summarisation, built retrieval-augmented assistants for a health startup, and spent a summer building MRI analysis pipelines at the Vanderbilt Institute for Surgery and Engineering.

  That summer changed how I think about machine learning. The hard problems were rarely the model — they were the data: where it came from, what it silently assumed, and whether anyone could reproduce the result six months later. This site is where I document that kind of thinking: experiments, notes, and the things I build to understand something better.
